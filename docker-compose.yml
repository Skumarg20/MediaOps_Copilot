

services:
  postgres:
    image: postgres:16-alpine
    container_name: mediaops-postgres
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: mediaops
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U copilot -d mediaops']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: mediaops-ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ['CMD-SHELL', 'ollama list >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mediaops-api
    ports:
      - '8080:8080'
    environment:
      PROJECT_ENV: production
      NODE_ENV: production
      DB_HOST: postgres
      DB_USER: copilot
      DB_PASSWORD: copilot
      DB_DATABASE: mediaops
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_PROVIDER: ${LLM_PROVIDER:-hybrid}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_LLAMA: ${OPENROUTER_MODEL_LLAMA:-meta-llama/llama-3.2-3b-instruct}
      OPENROUTER_MODEL_QWEN: ${OPENROUTER_MODEL_QWEN:-qwen/qwen-2.5-7b-instruct}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: mediaops-web
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: mediaops-otel-collector
    profiles: ['telemetry']
    command: ['--config=/etc/otel-collector.yaml']
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
      - '13133:13133'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:13133']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  ollama-models:
